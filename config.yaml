seed: 42

data:
  # Path to the PAB Track-4 image dataset (Parts 1-5) on Kaggle.
  # Expected structure: <image_root>/Part 1/imgs_0/imgs_0/goal/*.webp, ...
  image_root: "/kaggle/input/pab-eccv26-track4-train-webp-part-01-05"

  # Path to a folder containing the JSONL annotation files (imgs_0.json,
  # imgs_1.json, ...). One JSON object per line. Friend can either:
  #   (a) upload these as a Kaggle dataset, or
  #   (b) the notebook downloads them at runtime from HF (TruongVox/Cawot-dataset).
  annotations_dir: "/kaggle/working/annotations"

  # Random sample size from the full annotation pool. None = use everything
  # whose shard is on disk. 50K is a good Kaggle P100 default (~20 min embed).
  sample_size: 50000

  # Held-out (image, caption) val pairs for image-text retrieval R@k.
  val_size: 2000

  image_size: 224
  num_workers: 2

embed:
  # CLIP model used for BOTH selection embeddings and downstream training.
  # V0 keeps these consistent (unlike the V2 future, which can use a heavier
  # model for selection).
  model: "ViT-B-16"
  pretrained: "openai"
  batch_size: 128
  device: "cuda"
  output_dir: "/kaggle/working/outputs/embeddings"

cluster:
  # K-means clusters. Rule of thumb: K ≈ √(N/2) → ~155 for 48K train pool.
  k: 150
  niter: 25
  spherical: true
  use_gpu: true
  output_path: "/kaggle/working/outputs/clusters.npz"

coreset:
  budget_ratio: 0.20
  output_dir: "/kaggle/working/outputs"

train:
  # Must match `embed.model` for V0 (we reuse the model for finetune).
  model: "ViT-B-16"
  pretrained: "openai"
  unfreeze_last_n_layers: 4
  batch_size: 96
  num_epochs: 3
  lr: 1.0e-5
  weight_decay: 0.1
  warmup_steps: 100
  temperature: 0.07
  use_learned_temp: true
  grad_accum_steps: 1
  amp: true
  output_dir: "/kaggle/working/outputs/checkpoints"
  log_every: 50

eval:
  batch_size: 128
  k_values: [1, 5, 10]
  output_dir: "/kaggle/working/outputs/eval"
