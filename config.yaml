seed: 42

data:
  # PAB data downloaded from HuggingFace via scripts/setup_data.py.
  # Layout produced by that script:
  #   <image_root>/imgs_0/goal/0.jpg, <image_root>/imgs_1/goal/0.jpg, ...
  #   <annotations_dir>/imgs_0.json, imgs_1.json, ...
  image_root: "/kaggle/working/pab_data/images"
  annotations_dir: "/kaggle/working/pab_data/annotations"

  # Random sample size from the full annotation pool. None = use everything
  # whose shard is on disk. 50K is a good Kaggle P100 default (~20 min embed).
  sample_size: 50000

  # Held-out (image, caption) pairs used as the retrieval val set.
  # Bigger gallery = harder retrieval = less saturation. 5000 queries ranked
  # against 5000 gallery images gives real headroom (vs. 2000 which saturated
  # at ~94% R@1). This val set is FIXED across all budgets/seeds so numbers
  # are directly comparable.
  val_size: 5000

  image_size: 224
  num_workers: 2

embed:
  # CLIP model used for BOTH selection embeddings and downstream training.
  # V0 keeps these consistent (unlike the V2 future, which can use a heavier
  # model for selection).
  model: "ViT-B-16"
  pretrained: "openai"
  batch_size: 128
  device: "cuda"
  output_dir: "/kaggle/working/outputs/embeddings"

cluster:
  # K-means clusters. Rule of thumb: K ≈ √(N/2) → ~155 for 48K train pool.
  k: 150
  niter: 25
  spherical: true
  use_gpu: true
  output_path: "/kaggle/working/outputs/clusters.npz"

coreset:
  # Budget sweep matching the plan's scaling-law points exactly
  # (Part B2: 5/10/20/30/40/50%). Smooth curve from low to high budget.
  budgets: [0.05, 0.10, 0.20, 0.30, 0.40, 0.50]
  # Methods compared in one sweep:
  #   random   - uniform baseline
  #   v0       - farthest-from-centroid (diversity / atypical) [plan V0]
  #   v0_proto - closest-to-centroid (prototype / representative) [diagnostic]
  #   v1       - cross-modal cost + facility location [plan V1]
  #   v2       - Wasserstein-aware budget + cross-modal facility location [plan V2]
  methods: [random, v0, v0_proto, v1, v2]
  # V2 budget formula:  B_k ∝ n_k^alpha × (1 + W_k / W_avg).
  # alpha = 0.5 (plan default) — sub-linear scaling vs cluster size.
  v2_alpha: 0.5
  output_dir: "/kaggle/working/outputs"

# Q_proxy (V2 only): LLM-generated synthetic text queries used as
# distribution anchor for Wasserstein-aware budget allocation.
qproxy:
  # Path to queries.json (the 2,593 LLM queries from friend's qproxy folder).
  # Use scripts/setup_qproxy.py to download from Drive first.
  queries_json_path: "/kaggle/working/qproxy/queries.json"
  # Cache for CLIP-B/16-encoded Q_proxy embeddings (re-encoded from captions).
  cache_path: "/kaggle/working/outputs/embeddings/qproxy_clip_text_emb.npy"

train:
  # Must match `embed.model` for V0 (we reuse the model for finetune).
  model: "ViT-B-16"
  pretrained: "openai"
  unfreeze_last_n_layers: 4
  batch_size: 96
  num_epochs: 3
  lr: 1.0e-5
  weight_decay: 0.1
  warmup_steps: 100
  temperature: 0.07
  use_learned_temp: true
  grad_accum_steps: 1
  amp: true
  output_dir: "/kaggle/working/outputs/checkpoints"
  log_every: 50
  # 3 seeds for proper error bars (plan Tuần 4-5 spec). Each seed re-clusters
  # + re-selects random + retrains → error bars capture selection + training
  # noise. Total sweep: 4 methods × 6 budgets × 3 seeds = 72 runs ≈ 17 h
  # compute. Split across multiple Kaggle sessions; run_sweep.py is RESUMABLE
  # (reads records.csv at start and skips completed combos).
  seeds: [42, 1, 2]
  # Delete each checkpoint right after eval (72 ckpts × ~600 MB won't fit
  # Kaggle disk). Numbers are reproducible from seed.
  keep_checkpoints: false

eval:
  batch_size: 128
  k_values: [1, 5, 10]
  output_dir: "/kaggle/working/outputs/eval"
