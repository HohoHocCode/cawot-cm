# Full supplementary-baseline sweep.
#
# Use this file after configs/smoke_published_baselines.yaml passes.
# Do not use config.yaml for this run: config.yaml is the V2.1 add-on sweep.

seed: 42

data:
  image_root: "/kaggle/working/pab_data/images"
  annotations_dir: "/kaggle/working/pab_data/annotations"
  sample_size: 50000
  val_size: 5000
  image_size: 224
  num_workers: 2

embed:
  model: "ViT-B-16"
  pretrained: "openai"
  batch_size: 128
  device: "cuda"
  output_dir: "/kaggle/working/outputs/embeddings"

cluster:
  k: 150
  niter: 25
  spherical: true
  use_gpu: true
  output_path: "/kaggle/working/outputs_published_baselines/clusters.npz"

coreset:
  budgets: [0.05, 0.10, 0.20, 0.30, 0.40, 0.50]
  methods: [clipscore, semdedup, k_center]
  v2_alpha: 0.5
  published_baselines:
    semdedup:
      lambda_image: 0.5
      max_similarity: 0.95
      keep: hard
  output_dir: "/kaggle/working/outputs_published_baselines"

qproxy:
  queries_json_path: "/kaggle/working/qproxy/queries.json"
  cache_path: "/kaggle/working/outputs/embeddings/qproxy_clip_text_emb.npy"

train:
  model: "ViT-B-16"
  pretrained: "openai"
  unfreeze_last_n_layers: 4
  batch_size: 96
  num_epochs: 3
  lr: 1.0e-5
  weight_decay: 0.1
  warmup_steps: 100
  temperature: 0.07
  use_learned_temp: true
  grad_accum_steps: 1
  amp: true
  output_dir: "/kaggle/working/outputs_published_baselines/checkpoints"
  log_every: 50
  seeds: [42, 1, 2]
  keep_checkpoints: false

eval:
  batch_size: 128
  k_values: [1, 5, 10]
  output_dir: "/kaggle/working/outputs_published_baselines/eval"
